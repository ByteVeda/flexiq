# Lighthouse budgets for the docs site.
#
# Run `pnpm build` first, without DOCS_BASE_PATH. The Pages build sets it to
# /flexiq, which rewrites every asset URL to /flexiq/... while `buildEnd` moves
# the files back to the client root — correct once Pages serves them under that
# prefix, but unservable by a static server rooted at /.
ci:
  collect:
    staticDistDir: ./build/client
    # Three shapes rather than all ~200 prerendered pages: the landing page is
    # the heaviest (hero, code panes, fonts), a guide is the ordinary case with
    # syntax-highlighted blocks, and architecture renders Mermaid on the client.
    # Directory URLs, not the index.html files. The splat route builds its slug
    # from the raw URL (`routes/docs.$.tsx` pathOf), so a trailing /index.html
    # becomes part of the slug, matches no doc, and the page renders with an
    # empty description and a hydration mismatch that neither is real.
    url:
      - http://localhost/
      - http://localhost/python/getting-started/quickstart/
      - http://localhost/architecture/
    # The reported score is the median of the runs, so an unlucky one on a
    # noisy runner does not fail the job on its own.
    numberOfRuns: 3
    settings:
      preset: desktop
  # Every floor is the worst median measured across the three URLs above, so
  # the gate starts green and only moves on a regression. Raise a floor the
  # moment the matching fix lands — none of these are aspirational targets.
  assert:
    assertions:
      # Measured 0.98-0.99. The gap is headroom for a slower CI runner; the
      # other three are deterministic and so are pinned at what they measure.
      categories:performance: ["error", { "minScore": 0.9 }]
      # All three measure 1.0 and are held there. They were 0.94/0.96/0.90 when
      # this gate landed; every one of those was real and is fixed, so there is
      # nothing here to grow back into.
      categories:accessibility: ["error", { "minScore": 1 }]
      categories:best-practices: ["error", { "minScore": 1 }]
      categories:seo: ["error", { "minScore": 1 }]
  upload:
    target: filesystem
    outputDir: .lighthouseci
