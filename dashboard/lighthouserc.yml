# Lighthouse budgets for the dashboard SPA.
#
# Run `pnpm build` first. The path below is vite.config.ts's own outDir, so this
# audits exactly the bundle the Python wheel, the npm package and the server
# image embed — not a separate build made only for measuring.
ci:
  collect:
    staticDistDir: ../sdks/python/flexiq/static/dashboard
    # Everything past the sign-in screen needs a running backend, so that
    # screen is the whole of what a static audit can reach.
    url:
      - http://localhost/index.html
    isSinglePageApplication: true
    # The reported score is the median of the runs, so an unlucky one on a
    # noisy runner does not fail the job on its own.
    numberOfRuns: 3
    settings:
      preset: desktop
  assert:
    assertions:
      # Measured 1.0. The gap is headroom for a slower CI runner; the two below
      # are deterministic and held at what they measure.
      categories:performance: ["error", { "minScore": 0.9 }]
      # 0.95 on master, and this is the first thing that found out why: the
      # sign-in screen's Refresh control puts --fg-subtle on --bg at 3.76:1.
      # The token misses 4.5:1 on every light surface, so it is not specific to
      # that element — a runner just renders the one a static audit can reach.
      # Fixed by lowering --fg-subtle in the dark-theme PR; raise this to 1
      # once that lands, which is where it belongs.
      categories:accessibility: ["error", { "minScore": 0.95 }]
      categories:best-practices: ["error", { "minScore": 1 }]
      # Measured 0.82, and staying there: the console is behind auth and
      # deliberately not indexable, so it has no meta description or canonical
      # URL to give. Collected for the report, not gated.
      categories:seo: "off"
  upload:
    target: filesystem
    outputDir: .lighthouseci
