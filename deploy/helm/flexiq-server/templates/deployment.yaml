{{- include "flexiq-server.validate" . -}}
{{- $fullname := include "flexiq-server.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "flexiq-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flexiq-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flexiq-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A rotated certificate only takes effect on a restart, because the
        # server reads the PEM files once at boot.
        {{- if .Values.webhook.enabled }}
        checksum/webhook-tls: {{ include "flexiq-server.webhookCert" . | sha256sum }}
        {{- end }}
        # Same reason, for every credential the chart owns: a Secret referenced
        # through secretKeyRef is resolved into the container's environment once,
        # at pod start. Changing attach.token or the admin password rewrites the Secret
        # and leaves the Deployment spec untouched, so without this the pods keep
        # presenting the old value and reject the new one until someone restarts
        # them by hand — a rotation that silently does not take effect.
        #
        # A Secret this chart does not own cannot be hashed: `lookup` returns
        # nothing under `helm template`, so the annotation would differ between a
        # render and an install. Rotating an *existingSecret* therefore still
        # needs `kubectl rollout restart`, which the README says.
        {{- if include "flexiq-server.createsSecret" . }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "flexiq-server.serviceAccountName" . }}
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if .Values.storage.existingSecret }}
            - name: FLEXIQ_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.existingSecret }}
                  key: {{ .Values.storage.existingSecretKey }}
            {{- else if .Values.storage.dsn }}
            - name: FLEXIQ_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flexiq-server.secretName" . }}
                  key: dsn
            {{- end }}
            {{- with .Values.storage.backend }}
            - name: FLEXIQ_BACKEND
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.namespace }}
            - name: FLEXIQ_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            - name: FLEXIQ_QUEUES
              value: {{ join "," .Values.queues | quote }}
            {{- with .Values.workers }}
            - name: FLEXIQ_WORKERS
              value: {{ . | quote }}
            {{- end }}
            - name: FLEXIQ_MAINTENANCE
              value: {{ ternary "on" "off" .Values.maintenance | quote }}
            {{- if .Values.attach.enabled }}
            - name: FLEXIQ_LISTEN
              value: "0.0.0.0:{{ .Values.attach.port }}"
            {{- if .Values.attach.existingSecret }}
            - name: FLEXIQ_ATTACH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.attach.existingSecret }}
                  key: {{ .Values.attach.existingSecretKey }}
            {{- else if .Values.attach.token }}
            - name: FLEXIQ_ATTACH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flexiq-server.secretName" . }}
                  key: attach-token
            {{- end }}
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - name: FLEXIQ_DASHBOARD
              value: "0.0.0.0:{{ .Values.dashboard.port }}"
            - name: FLEXIQ_DASHBOARD_AUTH
              value: {{ .Values.dashboard.auth | quote }}
            {{- if .Values.dashboard.allowInsecure }}
            - name: FLEXIQ_ALLOW_INSECURE
              value: "1"
            {{- end }}
            {{- if .Values.dashboard.existingSecret }}
            - name: FLEXIQ_DASHBOARD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dashboard.existingSecret }}
                  key: {{ .Values.dashboard.existingSecretKeyUser }}
            - name: FLEXIQ_DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dashboard.existingSecret }}
                  key: {{ .Values.dashboard.existingSecretKeyPassword }}
            {{- else if .Values.dashboard.adminPassword }}
            - name: FLEXIQ_DASHBOARD_ADMIN_USER
              value: {{ .Values.dashboard.adminUser | quote }}
            - name: FLEXIQ_DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flexiq-server.secretName" . }}
                  key: admin-password
            {{- end }}
            {{- if .Values.dashboard.metricsToken }}
            - name: FLEXIQ_DASHBOARD_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flexiq-server.secretName" . }}
                  key: metrics-token
            {{- end }}
            {{- if .Values.dashboard.publicReadiness }}
            - name: FLEXIQ_DASHBOARD_PUBLIC_READINESS
              value: "1"
            {{- end }}
            {{- end }}
            {{- if .Values.grpc.enabled }}
            # No credential variable: the door authenticates against tokens in
            # the database, so there is nothing here to rotate or restart for.
            - name: FLEXIQ_GRPC_LISTEN
              value: "0.0.0.0:{{ .Values.grpc.port }}"
            - name: FLEXIQ_GRPC_EXECUTOR_STREAM_MAX_AGE
              value: "{{ .Values.grpc.executorStreamMaxAge }}"
            - name: FLEXIQ_GRPC_KEEPALIVE_INTERVAL
              value: "{{ .Values.grpc.keepaliveInterval }}"
            - name: FLEXIQ_GRPC_REQUEST_TIMEOUT
              value: "{{ .Values.grpc.requestTimeout }}"
            - name: FLEXIQ_GRPC_MAX_CONCURRENT_REQUESTS
              value: "{{ .Values.grpc.maxConcurrentRequests }}"
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: FLEXIQ_WEBHOOK_LISTEN
              value: "0.0.0.0:{{ .Values.webhook.port }}"
            - name: FLEXIQ_WEBHOOK_TLS_CERT
              value: /etc/flexiq/webhook-tls/tls.crt
            - name: FLEXIQ_WEBHOOK_TLS_KEY
              value: /etc/flexiq/webhook-tls/tls.key
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.attach.enabled }}
            - name: attach
              containerPort: {{ .Values.attach.port }}
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
            {{- end }}
            {{- if .Values.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.grpc.port }}
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
            {{- end }}
          # Liveness and readiness answer different questions, so they differ
          # where they can. Liveness is "is the process there" — /health, the one
          # route that is never gated. Readiness is "can it serve" — /readiness,
          # which checks storage, but only answers a bare probe when
          # publicReadiness is on; otherwise it 401s and the pod never goes
          # Ready, so it falls back to /health.
          #
          # One probe per type is all Kubernetes takes, and one is all liveness
          # needs: every role is a listener in the *same* process, and a bind
          # that fails takes the process down rather than leaving it
          # half-served. So the branches below are a fallback chain, richest
          # signal first: the dashboard's HTTP readiness, then the webhook's,
          # then gRPC health, and finally a bare TCP connect for the attach
          # port, which speaks no protocol a kubelet knows.
          {{- if .Values.dashboard.enabled }}
          livenessProbe:
            httpGet: { path: /health, port: dashboard }
          readinessProbe:
            httpGet:
              path: {{ ternary "/readiness" "/health" .Values.dashboard.publicReadiness }}
              port: dashboard
          {{- else if .Values.webhook.enabled }}
          {{- $probe := dict "httpGet" (dict "path" "/health" "port" "webhook" "scheme" "HTTPS") }}
          livenessProbe: {{- toYaml $probe | nindent 12 }}
          readinessProbe: {{- toYaml $probe | nindent 12 }}
          {{- else if .Values.grpc.enabled }}
          {{/*
          The same split as the dashboard's, in gRPC's vocabulary: a TCP connect
          says the process is there, and grpc.health.v1 — which this server
          answers out of storage — says it can serve. Health must not be the
          liveness probe: a database outage would then restart the pod instead
          of taking it out of rotation.

          The `grpc` probe field is only understood from Kubernetes 1.24, and an
          older API server rejects it rather than ignoring it, so
          grpc.healthProbe=false falls readiness back to the socket. That loses
          the storage signal, which is why it is opt-out and not the default.
          */}}
          livenessProbe:
            tcpSocket: { port: grpc }
          readinessProbe:
            {{- if .Values.grpc.healthProbe }}
            grpc: { port: {{ .Values.grpc.port }} }
            {{- else }}
            tcpSocket: { port: grpc }
            {{- end }}
          {{- else }}
          {{- $probe := dict "tcpSocket" (dict "port" "attach") }}
          livenessProbe: {{- toYaml $probe | nindent 12 }}
          readinessProbe: {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-tls
              mountPath: /etc/flexiq/webhook-tls
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "flexiq-server.webhookSecretName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
