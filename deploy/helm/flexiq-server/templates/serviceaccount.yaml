{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexiq-server.serviceAccountName" . }}
  labels:
    {{- include "flexiq-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC accompanies this account. The server never calls the Kubernetes API —
# the webhook is called *by* the API server and answers in the response body —
# so a token mounted here would grant more than the workload needs.
automountServiceAccountToken: false
{{- end }}
