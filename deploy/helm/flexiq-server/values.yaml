# Default values for flexiq-server.
#
# The chart installs one Deployment that plays up to four roles — scheduler
# (dispatching over attach or push, never both), dashboard, sidecar injector,
# and gRPC door — because they are one binary and one image. Turn off what you
# do not want; at least one role has to stay on.

image:
  repository: ghcr.io/byteveda/flexiq-server
  # Defaults to .Chart.AppVersion, so an upgrade moves the image with the chart.
  tag: ""
  pullPolicy: IfNotPresent
pullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Storage the scheduler and dashboard read. Required unless the deployment runs
# the webhook alone.
storage:
  # Passed as FLEXIQ_DSN. Prefer existingSecret over a value in git.
  dsn: ""
  # Read FLEXIQ_DSN from an existing Secret instead.
  existingSecret: ""
  existingSecretKey: dsn
  # sqlite | postgres | redis. Empty lets the DSN's scheme decide.
  backend: ""

# Tenant namespace every scheduler and dashboard view is scoped to. Empty
# addresses every namespace, which is what a single-tenant install wants —
# except with grpc.enabled, which serves one named namespace and refuses to
# start without this set.
namespace: ""
queues:
  - default
# Dispatch concurrency. Empty sizes it from the slots attached executors
# advertise, which is almost always right.
workers: ""
# Retention and cleanup. Turn off on extra replicas so one owns the sweeps.
maintenance: true

attach:
  enabled: true
  port: 7777
  # A non-loopback bind requires a token; the server refuses to start without
  # one. Generate with `openssl rand -base64 32`.
  token: ""
  existingSecret: ""
  existingSecretKey: attach-token
  # Extra annotations for the Service that fronts the attach port.
  service:
    annotations: {}

dashboard:
  enabled: true
  port: 8080
  # off | session. `session` is the only safe choice for a reachable dashboard.
  auth: session
  # Acknowledge an unauthenticated dashboard. Required with auth=off, because
  # the Service reaches it from anywhere in the cluster.
  allowInsecure: false
  # Bootstraps the first admin. Leave empty to use the SPA's first-run setup.
  adminUser: ""
  adminPassword: ""
  existingSecret: ""
  existingSecretKeyUser: admin-user
  existingSecretKeyPassword: admin-password
  # Bearer token gating /metrics. Also gates /readiness unless publicReadiness
  # below is on.
  metricsToken: ""
  # Answer /readiness without a credential, so the readiness probe can be the
  # real storage check rather than the liveness stub. A kubelet probe carries no
  # credential and a probe header is a literal string in the manifest, so the
  # alternative is copying the token out of its Secret into the Deployment spec.
  # What this publishes to anything that can reach the port: whether storage
  # answers, and how many workers are registered.
  publicReadiness: true
  service:
    type: ClusterIP
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: flexiq.example.com
    path: /
    pathType: Prefix
    tls: []

# The gRPC listener: the network-side producer door — enqueue, read and cancel
# over gRPC rather than over a database connection — alongside grpc.health.v1
# and server reflection.
grpc:
  enabled: false
  port: 50051
  # Seconds an attached executor's stream lives before the scheduler drains it
  # and closes it. A stream cannot be load balanced once it has started, so it
  # has to end for a replacement to land somewhere else; the drain is what makes
  # ending it free of dropped work. 0 never rotates.
  executorStreamMaxAge: 1800
  # Seconds between HTTP/2 keepalive pings on an idle connection. An HTTP/2
  # ping and not a TCP one: the server binds its own socket, so the TCP-level
  # setting would be accepted and ignored. 0 sends none.
  keepaliveInterval: 60
  # Seconds a call may take to produce its response *head* before the listener
  # answers DEADLINE_EXCEEDED. That is the whole call for every unary RPC —
  # which is all of flexiq.v1 — but it does not bound a response body, so it
  # closes no long-lived stream: Attach, grpc.health.v1/Watch and reflection
  # all answer immediately and then stay open. Use executorStreamMaxAge to
  # bound an attach stream. 0 is unbounded.
  requestTimeout: 30
  # Calls one connection may have in flight. The door answers out of a bounded
  # storage pool, so more concurrency buys a queue in front of that pool rather
  # than throughput. Per connection, so one noisy client cannot crowd out
  # another's. 0 is unlimited.
  maxConcurrentRequests: 256
  # There is no credential to set here. Callers present a scoped API token
  # stored in the database, which is why this chart no longer carries a gRPC
  # secret: a token is minted per client, expires, and is revoked on its own
  # without restarting a pod or re-issuing to everyone else.
  #
  # Mint the first one against a running pod:
  #
  #   kubectl exec deploy/<release>-flexiq-server -- \
  #     flexiq-server token create --name my-producer --scope produce
  #
  # or from the dashboard, under Configuration → gRPC tokens. Until one exists
  # the door refuses every call, which is deliberate: a listener with no
  # credential provisioned is a misconfiguration, not a permission grant.
  # Readiness by gRPC health rather than a bare TCP connect. The health check is
  # the better signal, because the server answers it out of storage. Turn it off
  # for a cluster older than Kubernetes 1.24, whose API server rejects the
  # `grpc` probe field outright.
  healthProbe: true
  # Its own Service, like attach: the door clients dial and the port people
  # browse should not be one object an annotation can widen by accident.
  service:
    annotations: {}

# Push dispatch (#843/#844): instead of an executor attaching, the scheduler
# POSTs each claimed job straight to this URL — for a platform that starts a
# container from an inbound request rather than running one continuously.
# Additive, not a replacement for attach: the two cannot both be set, because
# a Worker holds exactly one dispatcher.
push:
  enabled: false
  # Where the scheduler POSTs a claimed job.
  url: ""
  # Jobs the target may run at once. Required — a push target announces no
  # slots of its own, so nothing here can size it for you.
  capacity: 1
  # Comma-separated hosts and CIDRs the target's resolved address must match.
  # Required — deny by default. Loopback, link-local and cloud metadata are
  # refused whatever this names.
  allow: ""
  # Seconds one dispatch may take before it is abandoned as failed.
  timeout: 60
  # Seconds the connection may take to establish.
  connectTimeout: 5
  # Seconds shutdown waits for in-flight dispatches, and then again for each
  # to settle once abandoned — a shutdown runs to at most twice this. Minimum
  # 1; zero is refused at boot. Kubernetes' own default grace period is 30s,
  # shorter than the 60s worst case this value implies, so either lower this
  # or raise terminationGracePeriodSeconds (bottom of this file) past 2 × it.
  drain: 30
  # Ceiling on one job's request body, in bytes.
  maxRequestBytes: 8388608
  # Ceiling on one response body read back, in bytes.
  maxResponseBytes: 1048576
  # none | bearer | hmac | oidc | sigv4. Every field a non-"none" scheme needs
  # beyond this one — a bearer token, an HMAC secret, an OIDC audience, a
  # SigV4 region override — is operator- and secret-specific enough that this
  # chart does not give each one its own value. Set the matching
  # FLEXIQ_PUSH_TARGET_* variable through extraEnv below, reading a
  # secret-bearing one from a Secret you create via valueFrom.secretKeyRef.
  auth: none
  # No Service and no containerPort: a push target dials out, so this role has
  # no listener for either to front.

# Annotation-driven executor sidecar injection.
webhook:
  enabled: false
  port: 9443
  # Namespaces the webhook applies to. Empty means every namespace the
  # namespaceSelector allows.
  namespaceSelector: {}
  objectSelector: {}
  # Ignore keeps a broken or unreachable injector from blocking every pod
  # creation in the cluster. Switch to Fail once you rely on injection.
  failurePolicy: Ignore
  certManager:
    # false: the chart generates a self-signed CA and leaf, and writes the CA
    # into the MutatingWebhookConfiguration. true: cert-manager issues them.
    enabled: false
    # Existing issuer to use. Empty creates a self-signed Issuer in the release
    # namespace.
    issuerRef: {}
  # Days the chart-generated certificate is valid for. Regenerated on `helm
  # upgrade` only when the Secret is missing, so this is the real rotation
  # interval.
  certValidityDays: 3650

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podAnnotations: {}
podLabels: {}

# Seconds Kubernetes waits after SIGTERM before SIGKILL. Empty leaves the field
# off the Deployment, which is Kubernetes' own 30s default.
#
# Push dispatch is the role that outgrows it: push.drain is spent twice, so a
# push shutdown runs to at most 2 × push.drain — 60s at the chart's default —
# and a 30s grace period cuts the second wait short, aborting in-flight
# dispatches and leaving their leases to the stale-job reaper. With
# push.enabled, either set this to more than 2 × push.drain or lower
# push.drain to fit inside the period you set.
terminationGracePeriodSeconds: ""

# The image already runs as nonroot:65532 and needs no write access to its own
# filesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Extra environment for the server container, as a plain list.
extraEnv: []
