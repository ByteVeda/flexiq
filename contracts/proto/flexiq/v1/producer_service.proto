// STABLE as of 2.0.0, the release that first shipped the gRPC role. Field
// numbers, field names and RPC shapes are permanent from here (§2.2 of
// tasks/specs/2026-09-01-flexiq-v1-proto-design.md): the `proto-breaking`
// label is for reverting a mistake made in the same release train, never for
// changing a shipped shape.
//
// The rules this package is held to are stated in full in job.proto, because a
// client reads the .proto and not the design document.

syntax = "proto3";

package flexiq.v1;

import "flexiq/v1/job.proto";
import "flexiq/v1/workflow.proto";
// The `google.api.http` bindings on every RPC below are the JSON facade's real
// routes, not an aspiration: the server's route table is drift-tested against
// them and contracts/openapi.json is generated from them, so a path here that
// nothing serves fails the build.
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

// The producer door: submit work, read it back, cancel it, count it.
//
// What this service deliberately does not offer, and will not grow:
//
//   * An admin surface. Pausing queues, dead-letter operations, workers,
//     periodic tasks and overrides are flexiq.admin.v1, a separate package
//     behind separate scopes: an operator surface and a producer surface have
//     different audiences and must not share a credential.
//   * A way to name a namespace. One listener serves exactly one namespace, and
//     it comes from the server's own configuration. A read for a job in another
//     namespace is indistinguishable from a job that does not exist.
//   * Uniqueness, debouncing and batching as verbs. They are options and
//     shapes: one Enqueue, one EnqueueBatch.
//
// And what it does not promise:
//
//   * No ordering. Priority and scheduled_at influence dispatch; nothing
//     promises two jobs enqueued in order run in order.
//   * No exactly-once execution. A unique_key dedupes an *enqueue*. Execution
//     is at-least-once.
//   * No batch atomicity. See EnqueueBatchResponse.
//   * No task-name validation. The server holds no task registry, so enqueuing
//     a task nobody implements succeeds and the job eventually dead-letters.
//   * No complete history. WatchJobs reports transitions as they happen and a
//     job's current state on (re)connect; it is not a log of every transition
//     a job has ever made.
//   * No permanent job ids. Retention archives and then deletes, so a NOT_FOUND
//     does not mean the job never existed.
//   * No safe blind retry of a write. UNAVAILABLE, DEADLINE_EXCEEDED and
//     CANCELLED on an Enqueue may all mean the write landed and the connection
//     dropped afterwards, and no field on the wire can tell. A client that
//     retries sets a unique_key — see EnqueueOptions.unique_key for the
//     window that key covers.
service ProducerService {
  // Submit one job.
  //
  // Not idempotent, even with a unique_key: the level is a property of the
  // method, and one that held only for some requests is one a proxy would apply
  // to the others.
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse) {
    option (google.api.http) = {
      post: "/v1/jobs"
      body: "*"
    };
  }

  // Submit many jobs, with one result per input item in input order.
  rpc EnqueueBatch(EnqueueBatchRequest) returns (EnqueueBatchResponse) {
    option (google.api.http) = {
      post: "/v1/jobs:batchEnqueue"
      body: "*"
    };
  }

  // Read one job by id.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/jobs/{job_id}"};
  }

  // Page through jobs, newest first.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/jobs"};
  }

  // Cancel a job, and report the state that leaves it in.
  //
  // Idempotent because the response describes state rather than what the call
  // did: a second call answers the same thing as the first.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option idempotency_level = IDEMPOTENT;
    // A custom method (AIP-136), and no `body`: the id is the whole request,
    // and the handler reads nothing off the wire.
    option (google.api.http) = {post: "/v1/jobs/{job_id}:cancel"};
  }

  // Per-status job counts, for one queue or for the whole namespace.
  rpc QueueStats(QueueStatsRequest) returns (QueueStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    // Two paths for one RPC: `queue` is optional and unset counts the
    // namespace, which no single path with a queue in it can express.
    option (google.api.http) = {
      get: "/v1/queues/{queue}/stats"
      additional_bindings: {get: "/v1/stats"}
    };
  }

  // Submit a workflow graph for execution.
  //
  // Not idempotent: there is no unique_key equivalent for a workflow, so a
  // retried call after a dropped connection can submit twice. See
  // SubmitWorkflowRequest.
  rpc SubmitWorkflow(SubmitWorkflowRequest) returns (SubmitWorkflowResponse) {
    option (google.api.http) = {
      post: "/v1/workflows"
      body: "*"
    };
  }

  // Read a workflow run's state and every node's.
  rpc GetWorkflowRun(GetWorkflowRunRequest) returns (GetWorkflowRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workflows/{run_id}"};
  }

  // Follow jobs as they change state, instead of polling GetJob.
  //
  // Watch a set of job ids, or a queue. See WatchJobsRequest for what each
  // reports, how to resume after a dropped stream, and the limits.
  //
  // The only streaming RPC in the package, and the only one with no JSON
  // facade path: a server stream has no request/response HTTP mapping.
  rpc WatchJobs(WatchJobsRequest) returns (stream WatchJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message EnqueueRequest {
  // The registered task to run. Not validated here; see the service comment.
  string task_name = 1;

  // The job's body.
  //
  // Setting no arm is an error: an absent body is not an empty one, and
  // `raw = ""` is a zero-length payload.
  //
  // Both arms end up as the same envelope in storage. They differ in what they
  // can express: `raw` carries anything the format does, `structured` carries
  // what JSON does. Pick `raw` if you have a CBOR library.
  oneof body {
    // The tagged envelope from BINDING_CONTRACT.md — one tag byte followed by
    // CBOR [args, kwargs]. Reaches storage untouched.
    bytes raw = 2;
    // Arguments the server encodes into that same envelope. Refuses the values
    // it cannot encode losslessly rather than rounding them, and does not
    // preserve object key order — see StructuredArgs.
    StructuredArgs structured = 3;
  }

  EnqueueOptions options = 4;
}

message EnqueueResponse {
  Job job = 1;

  // The unique_key matched a job that was already active, and this is that job
  // rather than a new one.
  //
  // Every other response field describes resulting state rather than what the
  // call did. This one is the exception, because it is the whole reason a
  // producer sets a unique_key: without it the two calls are indistinguishable.
  bool deduplicated = 2;
}

message EnqueueBatchRequest {
  // The same shape one Enqueue takes, so a client's single-enqueue handling
  // works unchanged per item.
  repeated EnqueueRequest items = 1;
}

message EnqueueBatchResponse {
  // One result per input item, in input order.
  //
  // **No atomicity is promised**, because not every backend can keep such a
  // promise. Where a batch is one transaction, an item failure fails the whole
  // RPC — returning earlier items as enqueued would report jobs that do not
  // exist — and the error carries the failing item's `index`. Where a batch can
  // partially apply, the RPC succeeds and an `error` arm means that item alone
  // did not land. Treating an `enqueued` arm as durable is correct under both.
  repeated EnqueueBatchItemResult results = 1;
}

message EnqueueBatchItemResult {
  oneof outcome {
    // Exactly what Enqueue answers, deduplicated included.
    EnqueueResponse enqueued = 1;
    // This item alone did not land.
    google.rpc.Status error = 2;
  }
}

message GetJobRequest {
  string job_id = 1;
  // Send Job.payload back. Off by default: a payload is the largest thing a job
  // carries and most readers do not want it.
  bool include_payload = 2;
  // Send Job.result back.
  bool include_result = 3;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  // Unset lists every status.
  optional JobStatus status = 1;
  // Unset lists every queue.
  optional string queue = 2;
  // Unset lists every task.
  optional string task_name = 3;
  // Rows per page. Zero takes the server's default; the server may return
  // fewer, and may cap a large value.
  int32 page_size = 4;
  // The previous response's next_page_token. Opaque: its contents are free to
  // change between backends and between releases, so a client passes it back
  // and interprets nothing.
  string page_token = 5;
}

message ListJobsResponse {
  // Newest first. Rows never carry payload or result — a page of a hundred jobs
  // would otherwise be a page of a hundred payloads. Read one with GetJob.
  repeated Job jobs = 1;
  // Empty when this is the last page.
  string next_page_token = 2;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  // The job as it stands after the call, carrying neither payload nor result.
  //
  // A pending job is CANCELLED outright. A running one cannot be stopped from
  // outside, so it comes back RUNNING with cancel_requested set and the task
  // stops at its next check. A job already in a terminal state comes back
  // unchanged, which is what makes calling this twice safe.
  Job job = 1;
}

message QueueStatsRequest {
  // Which queue to count. A request that does not name one counts every queue
  // in the namespace; the queue-scoped path always names one.
  optional string queue = 1;
}

message QueueStatsResponse {
  // Waiting to run.
  int64 pending = 1;
  // Currently executing.
  int64 running = 2;
  // Finished successfully.
  int64 completed = 3;
  // Failed terminally.
  int64 failed = 4;
  // Moved to the dead-letter queue.
  int64 dead = 5;
  // Cancelled.
  int64 cancelled = 6;
}

// What to watch, and where a resumed queue watch left off.
//
// **Watching ids.** The stream opens with one item per id: a SNAPSHOT of the
// job's current state, or `not_found_job_id` for an id that does not exist or
// is in another namespace — the two are indistinguishable, as they are to
// GetJob. Live transitions follow. Once a job's `terminal` item is sent that
// id is finished with, and when every id is, the stream ends with OK. So a
// watch on a job that is already terminal sends that one item and closes.
//
// Resuming an id watch needs no cursor: open it again. The snapshot is read
// from storage, so a job that finished while the client was away comes back
// terminal.
//
// **Watching a queue.** Live transitions of the queue's jobs, and no snapshot
// — a queue has no "current state" small enough to send. The stream opens with
// a checkpoint: an item with no `item` arm set, carrying only the `cursor` the
// watch starts from, so a stream lost before its first transition can still
// resume without a gap. Every item after it carries a `cursor` too; pass the
// last one back as `resume_cursor` to replay what the stream missed. The server keeps a bounded window of recent transitions in memory,
// per process: a cursor from another process, from before a restart, or older
// than the window fails FAILED_PRECONDITION with reason WATCH_CURSOR_EXPIRED.
// The transitions in the gap are gone: a client that needs the jobs' current
// state reads it with ListJobs, and either way watches again without a cursor.
//
// **Coverage.** A transition reaches a watch the moment this server process
// handles it. One handled by another process — another replica, or a worker
// that reads the database directly — reaches an id watch within the server's
// reconcile interval (seconds), because the server re-reads every watched id
// on that cadence. A queue watch sees only this process's transitions.
//
// **Limits.** At most 100 ids per watch, and a per-credential cap on
// concurrent watches (RESOURCE_EXHAUSTED, reason WATCH_LIMIT). A client that
// stops reading is not waited for: once it falls behind the server's buffer,
// the stream ends RESOURCE_EXHAUSTED with reason WATCH_OVERFLOW, and the client
// resumes as above. A server shutting down ends every stream UNAVAILABLE.
message WatchJobsRequest {
  // Setting no arm is an error.
  oneof target {
    // Between 1 and 100 ids.
    WatchJobIds job_ids = 1;
    // A queue name. Empty means "default", as in EnqueueOptions.queue.
    string queue = 2;
  }

  // A queue watch's last `cursor`, to replay what came after it. Opaque.
  // Refused on an id watch, which resumes by snapshot.
  string resume_cursor = 3;
}

// A set of job ids to watch.
message WatchJobIds {
  // Duplicates are watched once.
  repeated string job_ids = 1;
}

message WatchJobsResponse {
  // Unset on a queue watch's opening checkpoint, which carries only `cursor`.
  // A reader skips an item whose arm it does not recognise, and keeps its
  // cursor.
  oneof item {
    // A job's state, or a change to it.
    JobTransition transition = 1;
    // An id with no job this caller can see. Sent once, in place of its
    // snapshot; the id is then finished with.
    string not_found_job_id = 2;
  }

  // On a queue watch, where this item sits in the server's window; pass the
  // last one back as `resume_cursor`. Opaque. Empty on an id watch.
  string cursor = 3;
}

// What a JobTransition reports.
//
// A reader that does not recognise a value treats it like SNAPSHOT: the item
// still carries the job's status, and `terminal` still decides.
enum JobTransitionKind {
  JOB_TRANSITION_KIND_UNSPECIFIED = 0;
  // The job's current state, read from storage when the watch opened or when
  // the server's reconcile found it had moved on.
  JOB_TRANSITION_KIND_SNAPSHOT = 1;
  // Written to the queue.
  JOB_TRANSITION_KIND_ENQUEUED = 2;
  // Claimed and handed to a worker.
  JOB_TRANSITION_KIND_STARTED = 3;
  // Finished successfully.
  JOB_TRANSITION_KIND_COMPLETED = 4;
  // An attempt failed. Always followed by RETRYING or DEAD.
  JOB_TRANSITION_KIND_FAILED = 5;
  // Rescheduled for another attempt.
  JOB_TRANSITION_KIND_RETRYING = 6;
  // Dead-lettered: out of retries, not retryable, or shed.
  JOB_TRANSITION_KIND_DEAD = 7;
  // Cancelled, before or during its run.
  JOB_TRANSITION_KIND_CANCELLED = 8;
  // An attempt ended in a durable step sleep; the job is pending again.
  JOB_TRANSITION_KIND_SLEEPING = 9;
}

// One job's state as of one transition.
//
// Carries neither payload nor result. A client that wants the result reads it
// with GetJob once it sees `terminal`.
message JobTransition {
  string job_id = 1;
  string queue = 2;
  string task_name = 3;
  JobTransitionKind kind = 4;
  // The status the job is in after this transition.
  JobStatus status = 5;
  // The attempt this transition belongs to: the job's retry_count, zero for
  // the first run.
  int32 attempt = 6;
  // When the server observed the transition.
  google.protobuf.Timestamp time = 7;
  // This is the job's last item on this stream. The server decides, so a
  // client never has to know which statuses are terminal — FAILED, for one, is
  // not while RETRYING or DEAD is still to come.
  bool terminal = 8;

  // Error message of a failed attempt.
  optional string error = 16;
  // Why a job was dead-lettered without running out of retries, or cancelled
  // without running.
  optional string reason = 17;
  // A failed attempt was an execution timeout.
  optional bool timed_out = 18;
  // The instant a sleeping job is rescheduled to.
  google.protobuf.Timestamp wake_at = 19;
}
