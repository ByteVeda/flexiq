repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: ruff-check
        name: ruff check (flexiq + tests)
        entry: bash -c 'cd sdks/python && uv run ruff check flexiq/ tests/'
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format (flexiq + tests)
        entry: bash -c 'cd sdks/python && uv run ruff format --check flexiq/ tests/'
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy (flexiq + tests)
        entry: bash -c 'cd sdks/python && uv run mypy flexiq/ tests/ --no-incremental'
        language: system
        types: [python]
        pass_filenames: false

      # gofmt and go vet rather than golangci-lint: these need only the Go
      # toolchain, which anyone touching sdks/go already has. The full lint is
      # `make -C sdks/go lint`, and CI runs it on every push.
      - id: go-fmt
        name: go fmt (gofmt)
        # gofmt exits 0 whether or not it found anything, so the file list it
        # prints is the result.
        entry: bash -c 'cd sdks/go && test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
        language: system
        files: ^sdks/go/.*\.go$
        pass_filenames: false

      - id: go-vet
        name: go vet
        # -tags integration so the end-to-end suite is type-checked too. It
        # needs a flexiq-server to *run*, but only the Go toolchain to compile,
        # and a file no local hook looks at is a file that breaks in CI.
        entry: bash -c 'cd sdks/go && go vet -tags integration ./...'
        language: system
        files: ^sdks/go/(.*\.go|go\.mod|go\.sum)$
        pass_filenames: false

      - id: node-lint
        name: node lint (biome)
        entry: bash -c 'cd sdks/node && pnpm exec biome ci src test'
        language: system
        files: ^sdks/node/(src/|test/|biome\.json)
        pass_filenames: false

      - id: node-typecheck
        name: node typecheck (tsc)
        entry: bash -c 'cd sdks/node && pnpm exec tsc --noEmit -p tsconfig.json'
        language: system
        files: ^sdks/node/(src/|test/|tsconfig\.json|package\.json)
        pass_filenames: false

      - id: dashboard-lint
        name: dashboard lint (biome)
        entry: bash -c 'cd dashboard && pnpm exec biome ci src/'
        language: system
        files: ^dashboard/src/
        pass_filenames: false

      - id: dashboard-typecheck
        name: dashboard typecheck
        entry: bash -c 'cd dashboard && pnpm exec tsc --noEmit'
        language: system
        files: ^dashboard/(src/|tsconfig\.json|package\.json)
        pass_filenames: false

      - id: dashboard-test
        name: dashboard tests (vitest)
        entry: bash -c 'cd dashboard && pnpm exec vitest run'
        language: system
        files: ^dashboard/src/
        pass_filenames: false

      - id: docs-lint
        name: docs lint (biome)
        entry: bash -c 'cd docs && pnpm exec biome ci app/'
        language: system
        files: ^docs/(app/|biome\.json)
        pass_filenames: false

      - id: docs-typecheck
        name: docs typecheck (react-router typegen + tsc)
        entry: bash -c 'cd docs && pnpm run typecheck'
        language: system
        files: ^docs/(app/|tsconfig\.json|package\.json)
        pass_filenames: false

      - id: proto-check
        name: proto check (buf format, lint, descriptor drift)
        entry: ./scripts/proto-check.sh
        language: system
        files: ^contracts/proto/
        pass_filenames: false
