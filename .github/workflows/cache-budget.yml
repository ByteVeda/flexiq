name: Cache budget

# Past 10 GB, GitHub evicts least-recently-used entries silently: CI stays
# green and gets slower. This is the alarm, plus the invariant behind the
# layout — a Cargo cache on master and nowhere else.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Write, to delete superseded entries before measuring.
  actions: write

env:
  CACHES_JQ: >-
    .actions_caches[] | {id, size: .size_in_bytes, ref, key,
    created: .created_at, last_used: .last_accessed_at}

jobs:
  budget:
    name: Cache budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test the prune rule
        working-directory: scripts
        run: python3 -m unittest test_cache_budget

      # A replaced key lingers until the 10 GB LRU sweep or 7 idle days, so
      # without this the total sits at the cap and evicts live caches.
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/caches?per_page=100" --paginate \
            --jq "$CACHES_JQ" | jq -s '.' > caches.json
          python3 scripts/cache_budget.py caches.json --superseded > stale.txt
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/caches/$id"
          done < stale.txt
          echo "Deleted $(wc -l < stale.txt) superseded cache(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Measure cache usage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Hard limit is 10 GB; fail early enough to fix the cause first.
          LIMIT_GB: "10"
          BUDGET_GB: "8.5"
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/caches?per_page=100" --paginate \
            --jq "$CACHES_JQ" | jq -s '.' > caches.json
          python3 scripts/cache_budget.py caches.json \
            --limit-gb "$LIMIT_GB" \
            --budget-gb "$BUDGET_GB" \
            | tee -a "$GITHUB_STEP_SUMMARY"
