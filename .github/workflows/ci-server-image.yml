name: CI Server Image

# Reusable workflow: builds docker/scheduler.Dockerfile on both published
# architectures — each on a native runner, since a Rust build under QEMU takes
# the better part of an hour — and asserts the binary reports the version
# scripts/version.mjs declares. Called by ci.yml when the image's inputs change.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # Nothing here talks to git after the checkout, so the token has no reason
      # to sit in .git/config for the length of a Docker build.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Read the declared version
        id: version
        run: printf 'version=%s\n' "$(node scripts/version.mjs --current)" >> "$GITHUB_OUTPUT"

      # No gha layer cache: `cargo build` misses on every commit (`COPY . .`
      # changes, the target mount stays on the runner), so `mode=max` saved
      # ~30 s and minted ~0.6 GB of blobs a day that evicted the Rust caches.
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/scheduler.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: flexiq-server:ci
          load: true

      - name: Binary reports the declared version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(docker run --rm flexiq-server:ci --version)"
          if [ "$reported" != "flexiq-server ${VERSION}" ]; then
            echo "::error::Image reports '${reported}', expected 'flexiq-server ${VERSION}'"
            exit 1
          fi

      # The reason `fq` lives in this workspace is that its version and the
      # server's cannot drift. Asserting it here reds a pull request rather
      # than shipping a release where they have.
      - name: The command line reports the same version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(docker run --rm --entrypoint /usr/local/bin/fq flexiq-server:ci --version)"
          if [ "$reported" != "fq ${VERSION}" ]; then
            echo "::error::fq reports '${reported}', expected 'fq ${VERSION}'"
            exit 1
          fi

      # publish-server.yml mirrors these labels onto the multiarch index, which
      # is where GHCR reads the package title and description from. Asserting
      # them here means a dropped LABEL reds a pull request instead of surfacing
      # as a blank package page one release later.
      - name: Image carries its OCI labels
        run: |
          set -euo pipefail
          labels="$(docker image inspect --format '{{ json .Config.Labels }}' flexiq-server:ci)"
          for key in title description source licenses version; do
            value="$(jq -r --arg k "org.opencontainers.image.${key}" '.[$k] // ""' <<<"$labels")"
            if [ -z "$value" ]; then
              echo "::error::Image is missing org.opencontainers.image.${key}"
              exit 1
            fi
          done
