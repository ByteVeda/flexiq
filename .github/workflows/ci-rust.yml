name: CI Rust

# Reusable workflow: Rust lint + the SQLite/PostgreSQL/Redis test matrices.
# Called by ci.yml when Rust-relevant paths change. See ci.yml for the env
# rationale (Cargo HTTP/1.1 + retry budget) — reusable workflows do not inherit
# the caller's env, so it is repeated here.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  lint:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          # Sole dev-cache writer, and only on master: a PR-ref cache can't be
          # read by other PRs anyway, so saving on PRs just mints throwaway
          # entries against the 10 GB quota. PRs restore master's cache instead.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Rustdoc is a lint over the tree, so unlike the MSRV build it *can*
      # regress between a merge and a tag: a branch that adds a broken intra-doc
      # link merges green and the release job is the first thing to see it. It
      # rides the lint job because clippy has already compiled the workspace at
      # --all-features here, so this costs the rustdoc passes and nothing else.
      #
      # This only checks that the docs we wrote are well-formed. Whether a public
      # item is documented at all is `missing_docs`, a rustc lint no flag here
      # turns on — each crate denies it in its own root instead.
      - name: Rustdoc is warning-free
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

      - name: Generic crates stay binding-free
        # The engine crates (core/workflows/mesh) must remain binding-agnostic so
        # the Python, Node, and Java shells can all reuse them. A pyo3, napi, OR
        # jni dep would let binding-specific code creep back in. cargo tree is
        # authoritative — you cannot `use pyo3`/`use napi`/`use jni` without
        # depending on it. See crates/flexiq-core/BINDING_CONTRACT.md.
        run: |
          set -euo pipefail
          for crate in flexiq flexiq-core flexiq-workflows flexiq-mesh; do
            # Capture first so a `cargo tree` failure aborts (set -e) instead of
            # being swallowed by the pipe and silently passing the check.
            tree_output="$(cargo tree -p "$crate" -e normal --all-features)"
            for binding in pyo3 napi jni; do
              if grep -qi "$binding" <<<"$tree_output"; then
                echo "::error::$binding is in the dependency tree of $crate — generic crates must stay binding-agnostic"
                exit 1
              fi
            done
          done
          echo "Generic crates are free of pyo3, napi, and jni."

  rust-test:
    name: Rust Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-prelude

      # $pythonLocation is exported to the job env by setup-python at runtime.
      - name: Run Rust test suite
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test --workspace

      - name: Run mesh crate tests
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test -p flexiq-mesh

      - name: Check build with native-async features
        run: cargo check --workspace --features native-async

      - name: Check build with mesh feature
        run: cargo check --workspace --features mesh

      # The default run compiles the gRPC role out, and the lint job's
      # --all-features clippy compiles it without running a test. This is the
      # only place the role actually binds a port.
      - name: Run the gRPC role's tests
        run: cargo test -p flexiq-server --features grpc

      # Off in every shipped artifact, so only CI keeps the three binding
      # shells' push-dispatch wiring compiling.
      - name: Run push-dispatch tests
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test --workspace --features push-dispatch

      - name: Check push-dispatch build with the listener-backed backends
        run: cargo check --workspace --features push-dispatch,postgres,redis

  rust-test-postgres:
    name: Rust Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: flexiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-prelude

      - name: Run Rust test suite (PostgreSQL backend)
        # Drop LD_LIBRARY_PATH + exclude flexiq-python: Python's OpenSSL (on that
        # path) and libpq's duel at-exit → flaky SIGSEGV. PG contract is in
        # flexiq-core/flexiq-workflows; python's Rust tests run in the SQLite job.
        run: cargo test --workspace --exclude flexiq-python --features postgres,workflows
        env:
          FLEXIQ_POSTGRES_TEST_URL: postgres://postgres:test@localhost:5432/flexiq_test

  rust-test-redis:
    name: Rust Tests (Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-prelude

      - name: Run Rust test suite (Redis backend)
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test --workspace --features redis,workflows
        env:
          FLEXIQ_REDIS_TEST_URL: redis://localhost:6379/15
