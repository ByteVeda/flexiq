name: CI Rust

# Reusable workflow: Rust lint + the SQLite/PostgreSQL/Redis test matrices.
# Called by ci.yml when Rust-relevant paths change. See ci.yml for the env
# rationale (Cargo HTTP/1.1 + retry budget) — reusable workflows do not inherit
# the caller's env, so it is repeated here.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  lint:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          # Sole dev-cache writer, and only on master: a PR-ref cache can't be
          # read by other PRs anyway, so saving on PRs just mints throwaway
          # entries against the 10 GB quota. PRs restore master's cache instead.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Generic crates stay binding-free
        # The engine crates (core/workflows/mesh) must remain binding-agnostic so
        # the Python, Node, and Java shells can all reuse them. A pyo3, napi, OR
        # jni dep would let binding-specific code creep back in. cargo tree is
        # authoritative — you cannot `use pyo3`/`use napi`/`use jni` without
        # depending on it. See crates/taskito-core/BINDING_CONTRACT.md.
        run: |
          set -euo pipefail
          for crate in taskito-core taskito-workflows taskito-mesh; do
            # Capture first so a `cargo tree` failure aborts (set -e) instead of
            # being swallowed by the pipe and silently passing the check.
            tree_output="$(cargo tree -p "$crate" -e normal --all-features)"
            for binding in pyo3 napi jni; do
              if grep -qi "$binding" <<<"$tree_output"; then
                echo "::error::$binding is in the dependency tree of $crate — generic crates must stay binding-agnostic"
                exit 1
              fi
            done
          done
          echo "Generic crates are free of pyo3, napi, and jni."

  rust-test:
    name: Rust Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-prelude

      # $pythonLocation is exported to the job env by setup-python at runtime.
      - name: Run Rust test suite
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test --workspace

      - name: Run mesh crate tests
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test -p taskito-mesh

      - name: Check build with native-async features
        run: cargo check --workspace --features native-async

      - name: Check build with mesh feature
        run: cargo check --workspace --features mesh

      # Off in every shipped artifact, so only CI keeps the three binding
      # shells' push-dispatch wiring compiling.
      - name: Run push-dispatch tests
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test --workspace --features push-dispatch

      - name: Check push-dispatch build with the listener-backed backends
        run: cargo check --workspace --features push-dispatch,postgres,redis

  rust-test-postgres:
    name: Rust Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-prelude

      - name: Run Rust test suite (PostgreSQL backend)
        # Drop LD_LIBRARY_PATH + exclude taskito-python: Python's OpenSSL (on that
        # path) and libpq's duel at-exit → flaky SIGSEGV. PG contract is in
        # taskito-core/taskito-workflows; python's Rust tests run in the SQLite job.
        run: cargo test --workspace --exclude taskito-python --features postgres,workflows
        env:
          TASKITO_POSTGRES_TEST_URL: postgres://postgres:test@localhost:5432/taskito_test

  rust-test-redis:
    name: Rust Tests (Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/rust-prelude

      - name: Run Rust test suite (Redis backend)
        run: LD_LIBRARY_PATH="$pythonLocation/lib" cargo test --workspace --features redis,workflows
        env:
          TASKITO_REDIS_TEST_URL: redis://localhost:6379/15

  # Everything a crates.io release of the Rust crates depends on: the declared
  # MSRV actually builds, the rustdoc is warning-free, the packages pass a
  # publish dry-run, and (once a baseline exists on crates.io) the public API
  # hasn't broken semver.
  #
  # The three are checked as a set, never one at a time: taskito-workflows and
  # taskito-mesh depend on taskito-core by path + version, so verifying either
  # alone would try to resolve taskito-core from the registry. Packaged
  # together, cargo resolves them against each other through a temp registry.
  publish-readiness:
    name: Publish Readiness (Rust crates)
    runs-on: ubuntu-latest
    env:
      CRATES: -p taskito-core -p taskito-workflows -p taskito-mesh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from workspace manifest
        id: msrv
        run: |
          msrv="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # --locked throughout: without it the first command may resolve a stale
      # Cargo.lock and rewrite it on the runner, leaving the later steps to
      # validate that rewritten lockfile instead of the committed one.
      - name: Check the crates build at the MSRV
        run: |
          read -ra pkgs <<< "$CRATES"
          cargo +${{ steps.msrv.outputs.version }} check --locked "${pkgs[@]}" --all-features

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rustdoc is warning-free
        run: |
          read -ra pkgs <<< "$CRATES"
          RUSTDOCFLAGS="-D warnings" cargo doc --locked "${pkgs[@]}" --no-deps --all-features

      - name: Packages pass a publish dry-run
        run: |
          read -ra pkgs <<< "$CRATES"
          cargo publish --dry-run --locked "${pkgs[@]}"

      # No baseline exists before a crate's first publish; its check is skipped
      # until then, and a breaking change fails CI once one does. Each crate is
      # probed separately — they reach the registry at different times, and a
      # published core must not stop gating just because mesh is still absent.
      - name: Check for crates.io baselines
        id: baseline
        run: |
          # Probe the sparse index (index.crates.io), not the REST API: it is
          # the registry's sanctioned programmatic path — a static CDN in
          # Cargo's own index format, no rate limits, no User-Agent policy
          # (the API 403s UA-less requests). Index path scheme for names of
          # 4+ chars: /{first-two}/{next-two}/{name}, lowercase.
          for crate in taskito-core taskito-workflows taskito-mesh; do
            prefix="${crate:0:2}/${crate:2:2}"
            # Fail closed: only an explicit 404 means "no baseline" — a transient
            # network error must not silently skip the semver check. Retries
            # absorb CDN blips before that verdict.
            if ! status="$(curl -sS -o /dev/null -w '%{http_code}' \
              --retry 3 --retry-connrefused \
              "https://index.crates.io/${prefix}/${crate}")"; then
              echo "Failed to query the crates.io sparse index for ${crate}" >&2
              exit 1
            fi
            case "$status" in
              200) echo "${crate}=true" >> "$GITHUB_OUTPUT" ;;
              404) echo "${crate}=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unexpected sparse-index response for ${crate}: HTTP $status" >&2; exit 1 ;;
            esac
          done

      - name: Semver check taskito-core
        if: steps.baseline.outputs.taskito-core == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: taskito-core

      - name: Semver check taskito-workflows
        if: steps.baseline.outputs.taskito-workflows == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: taskito-workflows

      - name: Semver check taskito-mesh
        if: steps.baseline.outputs.taskito-mesh == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: taskito-mesh
