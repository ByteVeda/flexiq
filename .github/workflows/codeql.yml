name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan so advisories added after merge still catch regressions.
    - cron: "0 6 * * 1"

# Cancel superseded PR scans only; master and scheduled scans must finish so
# their alerts still reach the security dashboard.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      security-events: write
      actions: read
      contents: read
    # The Rust extractor resolves the workspace through Cargo, so it inherits
    # the registry-fetch flakiness every other Rust job works around. No-ops for
    # the source-only languages.
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
            timeout: 30
          - language: javascript-typescript
            build-mode: none
            timeout: 30
          # Rust builds its database without compiling — `none` went GA for Rust
          # in CodeQL 2.23.3 and is what default setup uses. The extractor still
          # runs Cargo to resolve the workspace, and enables *all* features by
          # default, so `postgres`, `redis`, `workflows` and `mesh` are covered
          # by this one entry rather than a job per backend. Extraction walks the
          # whole dependency graph, so it needs more headroom than the two
          # source-only languages.
          - language: rust
            build-mode: none
            timeout: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
