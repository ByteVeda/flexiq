name: CI Chart

# Reusable workflow: lints the Helm chart, renders every role combination, and
# asserts the guarantees a broken template would silently drop — above all that
# the webhook's caBundle signs the certificate the pod serves. Called by ci.yml
# when the chart changes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/flexiq-server
      # Long enough to clear the server's own 16-character floor.
      TOKEN: 0123456789abcdef0123
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Lint
        run: helm lint "$CHART" --set storage.dsn=postgres://flexiq:secret@db:5432/app --set attach.token="$TOKEN"

      - name: Every role combination renders
        run: |
          set -euo pipefail
          render() {
            echo "::group::helm template $*"
            helm template t "$CHART" "$@" >/dev/null
            echo "::endgroup::"
          }
          render --set storage.dsn=postgres://u:p@db/x --set attach.token="$TOKEN"
          render --set storage.dsn=postgres://u:p@db/x --set attach.token="$TOKEN" --set webhook.enabled=true
          render --set attach.enabled=false --set dashboard.enabled=false --set webhook.enabled=true
          render --set storage.existingSecret=s --set attach.existingSecret=s
          render --set storage.dsn=postgres://u:p@db/x --set attach.enabled=false --set dashboard.ingress.enabled=true
          render --set storage.dsn=postgres://u:p@db/x --set attach.enabled=false \
            --set dashboard.enabled=false --set grpc.enabled=true --set namespace=prod
          render --set storage.dsn=postgres://u:p@db/x --set attach.token="$TOKEN" \
            --set grpc.enabled=true --set namespace=prod --set webhook.enabled=true

      - name: Invalid combinations are refused, not rendered
        run: |
          set -uo pipefail
          refuses() {
            local label="$1"; shift
            if helm template t "$CHART" "$@" >/dev/null 2>&1; then
              echo "::error::$label rendered but should have been refused"
              exit 1
            fi
            echo "refused: $label"
          }
          refuses "no roles enabled" --set attach.enabled=false --set dashboard.enabled=false
          refuses "attach without a token" --set storage.dsn=postgres://u:p@db/x
          refuses "a guessable token" --set storage.dsn=postgres://u:p@db/x --set attach.token=short
          refuses "a scheduler without a DSN" --set attach.token="$TOKEN"
          refuses "an unacknowledged open dashboard" \
            --set storage.dsn=postgres://u:p@db/x --set attach.enabled=false --set dashboard.auth=off
          # The server refuses the same combination at boot: the gRPC door
          # serves one named namespace and never the ambiguous unset one.
          refuses "a gRPC door with no namespace" \
            --set storage.dsn=postgres://u:p@db/x --set attach.enabled=false \
            --set dashboard.enabled=false --set grpc.enabled=true

      # A readiness probe that 401s leaves the pod NotReady forever, and the
      # only thing distinguishing the two cases is one env var reaching the
      # container alongside the path the probe uses.
      - name: Readiness probes what the server will actually answer
        run: |
          set -euo pipefail
          probe() {
            helm template t "$CHART" --set storage.dsn=postgres://u:p@db/x \
              --set attach.token="$TOKEN" "$@" \
              | python3 -c '
          import sys, yaml
          for doc in yaml.safe_load_all(sys.stdin):
              if not doc or doc.get("kind") != "Deployment":
                  continue
              container = doc["spec"]["template"]["spec"]["containers"][0]
              env = {e["name"] for e in container.get("env", [])}
              print(container["readinessProbe"]["httpGet"]["path"],
                    "FLEXIQ_DASHBOARD_PUBLIC_READINESS" in env)
          '
          }
          on="$(probe)"
          off="$(probe --set dashboard.publicReadiness=false)"
          echo "default: $on"
          echo "opted out: $off"
          [ "$on" = "/readiness True" ] || { echo "::error::default must probe /readiness with the env var set"; exit 1; }
          [ "$off" = "/health False" ] || { echo "::error::opting out must fall back to /health"; exit 1; }

      # A gRPC-only release has no HTTP route to probe, and the fallback it
      # lands on decides whether the pod ever goes Ready.
      - name: A gRPC-only release probes health, not just the socket
        run: |
          set -euo pipefail
          helm template t "$CHART" --set storage.dsn=postgres://u:p@db/x \
            --set attach.enabled=false --set dashboard.enabled=false \
            --set grpc.enabled=true --set namespace=prod \
            | python3 -c '
          import sys, yaml
          for doc in yaml.safe_load_all(sys.stdin):
              if not doc or doc.get("kind") != "Deployment":
                  continue
              container = doc["spec"]["template"]["spec"]["containers"][0]
              readiness = container["readinessProbe"]
              liveness = container["livenessProbe"]
              assert "grpc" in readiness, f"readiness must use the gRPC health probe: {readiness}"
              # Health reports storage, so it must not restart the pod on an outage.
              assert "tcpSocket" in liveness, f"liveness must be a socket probe: {liveness}"
              print("gRPC-only readiness:", readiness, "liveness:", liveness)
          '
          # Pre-1.24 clusters reject the `grpc` probe field outright, so the
          # documented opt-out has to actually change the rendered probe.
          helm template t "$CHART" --set storage.dsn=postgres://u:p@db/x \
            --set attach.enabled=false --set dashboard.enabled=false \
            --set grpc.enabled=true --set namespace=prod --set grpc.healthProbe=false \
            | python3 -c '
          import sys, yaml
          for doc in yaml.safe_load_all(sys.stdin):
              if not doc or doc.get("kind") != "Deployment":
                  continue
              readiness = doc["spec"]["template"]["spec"]["containers"][0]["readinessProbe"]
              assert "tcpSocket" in readiness, f"the opt-out must fall back to a socket: {readiness}"
              print("opted out of the gRPC probe:", readiness)
          '

      # The regression this exists for: `genCA` is random, so a helper called
      # once per template would hand the MutatingWebhookConfiguration a CA that
      # does not sign the certificate the pod serves — and every admission call
      # would fail TLS verification, in a way nothing but a live cluster shows.
      - name: The webhook caBundle signs the served certificate
        run: |
          set -euo pipefail
          helm template t "$CHART" \
            --set attach.enabled=false --set dashboard.enabled=false \
            --set webhook.enabled=true > rendered.yaml
          python3 - <<'PY'
          import base64, pathlib, re, subprocess, sys

          rendered = pathlib.Path("rendered.yaml").read_text()
          def field(name):
              match = re.search(rf"{re.escape(name)}: (\S+)", rendered)
              if not match:
                  sys.exit(f"{name} is missing from the rendered chart")
              return match.group(1)

          if field("ca.crt") != field("caBundle"):
              sys.exit("caBundle does not match the Secret's ca.crt")

          pathlib.Path("ca.pem").write_bytes(base64.b64decode(field("ca.crt")))
          pathlib.Path("leaf.pem").write_bytes(base64.b64decode(field("tls.crt")))
          verify = subprocess.run(
              ["openssl", "verify", "-CAfile", "ca.pem", "leaf.pem"],
              capture_output=True, text=True,
          )
          if verify.returncode != 0:
              sys.exit(f"the CA does not sign the leaf: {verify.stderr.strip()}")

          sans = subprocess.run(
              ["openssl", "x509", "-in", "leaf.pem", "-noout", "-ext", "subjectAltName"],
              capture_output=True, text=True,
          ).stdout
          # The API server dials the Service DNS name, so that is what has to be
          # in the certificate.
          if "t-flexiq-server-webhook.default.svc" not in sans:
              sys.exit(f"the certificate does not cover the Service DNS name: {sans}")

          print("caBundle matches, the CA signs the leaf, and the SANs cover the Service")
          PY
