name: Publish server image

# Publishes the flexiq-server container image to GHCR. Each architecture is
# built on its own native runner — a Rust build under QEMU takes the better part
# of an hour — and the two are merged into a manifest list at the end, so
# `docker pull` resolves the right one automatically.
#
# The image carries no language runtime, so one tag serves apps written against
# any SDK; there is nothing here to fan out per interpreter version.

on:
  push:
    tags:
      # Server-image releases use a `server-v` tag namespace, distinct from
      # Python (`v*`), Node (`node-v*`) and Java (`java-v*`).
      - "server-v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.21.0)"
        required: true
        type: string
      dry-run:
        description: "Build and smoke-test only — skip the GHCR push and tagging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # GHCR requires a lowercase path, and `github.repository_owner` is `ByteVeda`.
  IMAGE: ghcr.io/byteveda/flexiq-server

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_exists: ${{ steps.tag.outputs.exists }}
    steps:
      # The tag probe below reads a public remote, so it needs no credential.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#server-v}"
          else
            version="${VERSION_INPUT#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: ${version}"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify version matches codebase
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          node scripts/version.mjs --check
          repo_version="$(node scripts/version.mjs --current)"
          if [ "$repo_version" != "$VERSION" ]; then
            echo "::error::Resolved ${VERSION} but the repo declares ${repo_version}"
            exit 1
          fi

      # An existing tag at the current commit means a previous manual run got
      # past the tag push but failed later — treat it as a rerun. A tag pointing
      # elsewhere is a real conflict.
      - name: Check remote tag state
        id: tag
        if: github.event_name != 'push'
        run: |
          version="${{ steps.resolve.outputs.version }}"
          remote_sha="$(git ls-remote --tags origin "refs/tags/server-v${version}" | awk '{print $1}')"
          if [ -z "$remote_sha" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$remote_sha" = "$(git rev-parse HEAD)" ]; then
            echo "::notice::Tag server-v${version} already at this commit — treating as rerun"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag server-v${version} exists on remote at ${remote_sha}, not HEAD"
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
    steps:
      # Registry auth comes from the login step below; git is not used again.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Loaded into the local daemon first so the smoke test runs before
      # anything reaches the registry.
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/scheduler.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-image-${{ matrix.arch }}

      # The binary derives its version from the workspace Cargo.toml, so this
      # catches an image built from the wrong commit as well as a bad --build-arg.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          reported="$(docker run --rm "${IMAGE}:${TAG}" --version)"
          if [ "$reported" != "flexiq-server ${VERSION}" ]; then
            echo "::error::Image reports '${reported}', expected 'flexiq-server ${VERSION}'"
            exit 1
          fi
          label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE}:${TAG}")"
          if [ "$label" != "$VERSION" ]; then
            echo "::error::Image label declares '${label}', expected '${VERSION}'"
            exit 1
          fi

      # Exported straight to the registry rather than `docker push`ed out of the
      # daemon: a daemon push rewrites the manifest to Docker media types, and
      # `imagetools create` then drops the index annotations GHCR reads a
      # multiarch description from — silently, since a Docker manifest list has
      # no annotations field. Everything is already built, so this is a cache
      # hit plus the upload.
      - name: Push the per-architecture tag
        if: ${{ !inputs.dry-run }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/scheduler.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          # Attestations would make each per-architecture tag an index of its
          # own, adding an unknown/unknown entry to every published manifest.
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}

  manifest:
    name: Publish multiarch manifest
    needs: [preflight, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release
      packages: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG_EXISTS: ${{ needs.preflight.outputs.tag_exists }}
    steps:
      # No persisted credentials: only the tag push needs git auth, and it gets
      # the token explicitly.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The per-architecture tags stay in the registry as the manifest's
      # members; `:VERSION` and `:latest` are the addresses anyone pulls.
      #
      # GHCR takes a multiarch package's description from the index annotations
      # and never looks at the child images' config labels, so every label the
      # Dockerfile set is mirrored onto the index. Reading them back off the
      # pushed image keeps the Dockerfile the one place the strings live.
      - name: Merge the architectures into one manifest
        run: |
          set -euo pipefail
          labels="$(docker buildx imagetools inspect \
            --format '{{ json .Image.Config.Labels }}' "${IMAGE}:${VERSION}-amd64")"
          if [ -z "$labels" ] || [ "$labels" = "null" ]; then
            echo "::error::${IMAGE}:${VERSION}-amd64 carries no OCI labels"
            exit 1
          fi
          annotations=()
          while IFS= read -r label; do
            annotations+=(--annotation "index:${label}")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$labels")
          docker buildx imagetools create "${annotations[@]}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Verify both architectures resolve
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}")"
          echo "$manifest"
          for arch in amd64 arm64; do
            if ! jq -e --arg arch "$arch" \
              'any(.manifests[]?.platform; .os == "linux" and .architecture == $arch)' \
              <<<"$manifest" >/dev/null; then
              echo "::error::${IMAGE}:${VERSION} has no linux/${arch} entry"
              exit 1
            fi
          done
          # The package page renders this; a manifest that regressed to Docker
          # media types has no annotations at all and would publish blank.
          if ! jq -e '(.annotations["org.opencontainers.image.description"] // "") != ""' \
            <<<"$manifest" >/dev/null; then
            echo "::error::${IMAGE}:${VERSION} carries no image description annotation"
            exit 1
          fi

      # The chart and image versions are gated against the same workspace
      # version in preflight. Publishing only after manifest verification keeps
      # the chart from pointing at an absent or incomplete server image.
      - name: Publish Helm chart to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry-config.json
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/flexiq-server-${VERSION}.tgz"
          helm package deploy/helm/flexiq-server --destination "$RUNNER_TEMP"
          test -f "$archive"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push "$archive" oci://ghcr.io/byteveda/charts

      - name: Create git tag
        if: github.event_name != 'push' && env.TAG_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "server-v${VERSION}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin "server-v${VERSION}"

      # The wire contract, at a URL that names a version.
      #
      # A client in a language with no FlexiQ SDK generates its stubs from
      # these, and the only other ways to get them are cloning the repository
      # or reading them off server reflection — neither of which a build
      # pipeline should have to do. The image carries the binary and nothing
      # else, so it is not a source either.
      - name: Package the wire contract
        run: |
          set -euo pipefail
          # `proto/` carries its own buf.yaml and buf.lock, so a consumer can
          # run `buf generate` against the tree unchanged. wire-vectors.json
          # rides along because the payload envelope is the half of the contract
          # the .proto calls opaque.
          tar -czf "flexiq-proto-${VERSION}.tar.gz" -C contracts proto wire-vectors.json
          cp contracts/descriptor.binpb "flexiq-descriptor-${VERSION}.binpb"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "server-v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release server-v${VERSION} already exists — not recreating it"
          else
            gh release create "server-v${VERSION}" \
              --title "flexiq-server v${VERSION}" \
              --generate-notes
          fi
          # Uploaded outside the branch above, and with --clobber, because a
          # release that already exists is exactly the case where an asset may
          # be missing: a re-run after a failure between creating the release
          # and attaching the contract to it. Skipping the upload there would
          # leave that release permanently incomplete.
          gh release upload "server-v${VERSION}" --clobber \
            "flexiq-proto-${VERSION}.tar.gz" \
            "flexiq-descriptor-${VERSION}.binpb"
