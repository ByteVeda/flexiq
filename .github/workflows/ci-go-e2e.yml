name: CI Go e2e

# Reusable workflow: the Go client against a real flexiq-server.
#
# It is a workflow of its own rather than a job inside ci-go.yml because the two
# suites have different costs and different triggers. ci-go.yml needs no Rust
# toolchain at all, which is what makes a Go-only change cheap to check; folding
# a release build of the server into it would end that for every typo in a
# README. What this suite watches instead is the pair — the client, the wire
# contract, and the door on the other end of it.
#
# The server's own half is already pinned by crates/flexiq-server/tests. What
# only this suite covers is the two halves meeting: that a job this client
# enqueues is a job that server stores, that the payload bytes survive the round
# trip, and that a reason this client branches on is a reason that server sends.
#
# Called by ci.yml when Go, contract or server paths change.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  e2e:
    name: Go client against a real flexiq-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Read-only restore of the dev-profile namespace ci-rust.yml writes on
      # master. A namespace of its own would be another entry against the 10 GB
      # cache quota this repo has already hit once, for a build the lint job's
      # cache already covers most of.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: dev
          save-if: "false"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          # One version, not the matrix ci-go.yml runs. The question here is
          # whether the two halves agree on a wire, and the answer does not
          # differ per Go release — a version-specific break shows up in the
          # matrix suite, which is where the matrix belongs.
          go-version: "1.27.x"
          cache-dependency-path: sdks/go/go.sum

      # Debug rather than --release: the binary is exec'd, never shipped, and
      # the release profile's thin LTO buys nothing a test can observe.
      - name: Build flexiq-server with the gRPC door
        run: cargo build -p flexiq-server --features grpc

      # The harness finds this by walking up to the workspace manifest, so the
      # variable is belt and braces — and the one thing to change if the suite
      # ever runs against a binary it did not build.
      - name: Run the end-to-end suite
        working-directory: sdks/go
        env:
          FLEXIQ_SERVER_BIN: ${{ github.workspace }}/target/debug/flexiq-server
        run: make e2e
