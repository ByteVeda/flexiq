name: Publish to crates.io

on:
  push:
    tags:
      # Rust crates use a `crates-v` tag namespace, distinct from Python (`v*`),
      # Node (`node-v*`) and Java (`java-v*`). A crates.io version can be yanked
      # but never replaced, so the Rust release is cut on its own tag rather
      # than riding along with another registry's.
      - "crates-v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.22.0) — must match the repo"
        required: true
        type: string
      dry-run:
        description: "Package and verify only — skip the upload and the tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A second run mid-upload would race the first over the same versions.
concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  # Force HTTP/1.1 + extra retries for cargo's downloader — the same flaky
  # "HTTP2 framing layer" / "unexpected eof" failures the CI jobs hit. See ci.yml.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  # The publishable crates, in no particular order: flexiq-workflows and
  # flexiq-mesh both depend on flexiq-core, so the set goes up together and
  # cargo works out the upload order and the index waits itself. Every other
  # workspace member is `publish = false` — binding shells and binaries.
  CRATES: flexiq flexiq-core flexiq-workflows flexiq-mesh
  # The one version whose semver gate is waived — see the step that reads it.
  # Empty it, or move it forward, rather than deleting the check.
  SEMVER_EXEMPT_VERSION: "1.1.0"

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates.io
    permissions:
      contents: write # push the crates-v* tag on a dispatch run
      id-token: write # mint a short-lived crates.io token over OIDC
    steps:
      # Don't persist the write token in .git/config — cargo needs no git auth,
      # and the only push (the tag) gets the token explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#crates-v}"
          else
            version="${VERSION_INPUT#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version format: ${version}"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify version matches codebase
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          node scripts/version.mjs --check
          repo_version="$(node scripts/version.mjs --current)"
          if [ "$repo_version" != "$VERSION" ]; then
            echo "::error::Resolved ${VERSION} but the repo declares ${repo_version}"
            exit 1
          fi

      # The interpreter only — pyo3's build script queries it, and the rustdoc
      # step below now reaches flexiq-python. The dev deps are not needed, so
      # skip the sync.
      - name: Set up Python (libpython only)
        uses: ./.github/actions/setup-python
        with:
          sync: "false"

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # The tree-only readiness checks. They used to run on every pull request,
      # where they cost each branch an extra toolchain install and two more
      # compiles of the whole crate set to answer a question nobody asks until a
      # release is being cut. Nothing they check can regress between the merge
      # and the tag without a commit that CI already saw, so this is where they
      # earn their time.
      #
      # The MSRV toolchain is installed with plain rustup and invoked as
      # `cargo +<msrv>`, rather than through the toolchain action: that action
      # makes what it installs the *default*, which would silently hand every
      # later step in this job an MSRV compiler.
      #
      # --locked throughout: without it the first command may resolve a stale
      # Cargo.lock and rewrite it on the runner, leaving the later steps to
      # validate that rewritten lockfile instead of the committed one.
      - name: The crates build at the declared MSRV
        env:
          PACKAGES: -p flexiq -p flexiq-core -p flexiq-workflows -p flexiq-mesh
        run: |
          set -euo pipefail
          msrv="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          echo "::notice::Declared MSRV is ${msrv}"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          read -ra pkgs <<< "$PACKAGES"
          cargo "+$msrv" check --locked "${pkgs[@]}" --all-features

      # --workspace, not the published four: an unpublished crate's rustdoc still
      # rots, and a broken intra-doc link in flexiq-server is a link the docs
      # site and every IDE hover follow. The per-pull-request job in ci-rust.yml
      # runs the same command; this stays as the fail-closed re-check at the tag,
      # where the tree being published is the one actually inspected.
      - name: Rustdoc is warning-free
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps --all-features

      # Re-running a release must be a no-op for versions already up, so the
      # upload set is whatever is genuinely missing. Probing the sparse index
      # rather than the REST API: it is the registry's sanctioned programmatic
      # path — a static CDN in cargo's own index format, no rate limits and no
      # User-Agent policy (the API 403s UA-less requests). Path scheme for names
      # of 4+ chars is /{first-two}/{next-two}/{name}, lowercase.
      - name: Determine which crates still need publishing
        id: pending
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          pending=""
          baselined=""
          for crate in $CRATES; do
            prefix="${crate:0:2}/${crate:2:2}"
            # Fail closed: only an explicit 404 means "not published yet". A
            # transient error must never be read as "needs publishing" — that
            # would turn a CDN blip into a duplicate-version upload attempt.
            if ! status="$(curl -sS -o /tmp/index.json -w '%{http_code}' \
              --retry 3 --retry-connrefused \
              "https://index.crates.io/${prefix}/${crate}")"; then
              echo "::error::Failed to query the crates.io sparse index for ${crate}"
              exit 1
            fi
            case "$status" in
              404)
                echo "${crate}: not on crates.io yet"
                pending="${pending} -p ${crate}"
                ;;
              200)
                # The index file is NDJSON, one line per version — slurp it into
                # an array so the answer is an explicit true/false. Reading jq's
                # exit status instead would collapse "parse failed" into "not
                # published", which is the one mistake this probe must not make.
                if ! found="$(jq -s --arg v "$VERSION" 'any(.[]; .vers == $v)' /tmp/index.json)"; then
                  echo "::error::Could not parse the sparse-index response for ${crate}"
                  exit 1
                fi
                case "$found" in
                  true)
                    echo "${crate} ${VERSION} already on crates.io — skipping"
                    ;;
                  false)
                    echo "${crate}: ${VERSION} not yet published"
                    pending="${pending} -p ${crate}"
                    # Something is already up under this name, so the API
                    # about to go out has a baseline to be held against.
                    baselined="${baselined},${crate}"
                    ;;
                  *)
                    echo "::error::Unexpected version probe result for ${crate}: ${found}"
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "::error::Unexpected sparse-index response for ${crate}: HTTP ${status}"
                exit 1
                ;;
            esac
          done
          printf 'args=%s\n' "${pending# }" >> "$GITHUB_OUTPUT"
          printf 'baselined=%s\n' "${baselined#,}" >> "$GITHUB_OUTPUT"

      - name: Nothing to publish
        if: steps.pending.outputs.args == ''
        run: echo "::notice::Every crate already publishes ${{ steps.resolve.outputs.version }}"

      # The semver gate lives here rather than in pull-request CI, because the
      # question it answers — is this version number a big enough step for the
      # change to the public API? — is only answerable once a version is being
      # cut. A branch still declares the released version, so there a breaking
      # change and a deliberate major look identical.
      #
      # Only the crates being uploaded by this run are checked, and only those
      # already on crates.io: a first publish has no baseline, and a version
      # that went up earlier was gated when it did.
      #
      # `SEMVER_EXEMPT_VERSION` is one release's waiver, not a switch. 1.1.0
      # breaks the `flexiq-core` and `flexiq-workflows` public API under a minor
      # bump — the breaks are the surface of durable steps, the dispatch lease
      # and three other shipped features, and the crates have no third-party
      # dependents to protect (one published version, three reverse
      # dependencies, all of them this repository's own). Clearing the gate
      # honestly would mean withdrawing those features. Naming the version
      # rather than deleting the step is what makes 1.2.0 gated again without
      # anyone having to remember to restore it.
      - name: Semver check the crates being published
        if: >-
          steps.pending.outputs.baselined != ''
          && steps.resolve.outputs.version != env.SEMVER_EXEMPT_VERSION
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: ${{ steps.pending.outputs.baselined }}

      # Loud rather than silent: a skipped gate that logs nothing reads exactly
      # like a gate that passed.
      - name: Semver check waived for this version
        if: steps.resolve.outputs.version == env.SEMVER_EXEMPT_VERSION
        run: |
          echo "::warning::cargo-semver-checks is waived for ${SEMVER_EXEMPT_VERSION}; \
          its breaking changes are listed in the CHANGELOG's Breaking section"

      # Packages each pending crate and builds it from its own tarball, resolving
      # their inter-dependencies through a temporary registry. This is what
      # catches a missing file or an unpublishable dependency, and it is the
      # whole of a dry run — `cargo publish --dry-run` does exactly this and
      # nothing more, which is why the readiness job's separate dry run was not
      # carried over with the two steps above. The upload below reuses these
      # tarballs via --no-verify rather than compiling everything a second time.
      - name: Package and verify
        if: steps.pending.outputs.args != ''
        run: cargo package --locked ${{ steps.pending.outputs.args }}

      # Exchanges this job's OIDC identity for a token scoped to these crates and
      # valid for this run only. All three crates require trusted publishing, so
      # this is the only way in — an API token is rejected with a 403 even if one
      # is configured, which is why no fallback is left to silently prefer.
      - name: Authenticate to crates.io
        id: oidc
        if: ${{ !inputs.dry-run && steps.pending.outputs.args != '' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: ${{ !inputs.dry-run && steps.pending.outputs.args != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.oidc.outputs.token }}
        run: cargo publish --locked --no-verify ${{ steps.pending.outputs.args }}

      # Records which commit the crates were cut from, in its own namespace so it
      # never collides with the v* / node-v* / java-v* release tags. Written only
      # on a dispatch run — a tag push already carries the tag that triggered it
      # — and only when this run actually uploaded something. Tagging the
      # no-pending path would let a later commit carrying the same version claim
      # provenance over artifacts cut from an earlier one.
      - name: Create git tag
        if: ${{ github.event_name != 'push' && !inputs.dry-run && steps.pending.outputs.args != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: crates-v${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::${TAG} already points at this commit"
              exit 0
            fi
            echo "::error::${TAG} exists on remote at ${existing}, not HEAD"
            exit 1
          fi
          git tag "$TAG"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin "$TAG"
