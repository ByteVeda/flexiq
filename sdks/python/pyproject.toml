[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "flexiq"
# maturin reads the version off the crate at `tool.maturin.manifest-path`, so
# the wheel can never drift from the Rust core it wraps.
dynamic = ["version"]
description = "Rust-powered task queue for Python. No broker required."
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cbor2>=5.6",
    "cloudpickle>=3.0",
    "msgpack>=1.0",
    'tzdata; platform_system == "Windows"',
]
[project.urls]
Homepage = "https://github.com/ByteVeda/flexiq"
Documentation = "https://docs.byteveda.org/flexiq"
Repository = "https://github.com/ByteVeda/flexiq"
Changelog = "https://docs.byteveda.org/flexiq/more/changelog"
Issues = "https://github.com/ByteVeda/flexiq/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.11", "mypy>=1.15"]
fastapi = ["fastapi>=0.110.0", "pydantic>=2.5"]
django = ["django>=4.2"]
postgres = []  # PG driver is bundled in the Rust binary; extra exists for discoverability
redis = []     # Redis driver is bundled in the Rust binary; extra exists for discoverability
otel = ["opentelemetry-api", "opentelemetry-sdk"]
prometheus = ["prometheus-client"]
sentry = ["sentry-sdk"]
msgpack = ["msgpack"]
encryption = ["cryptography"]
flask = ["flask>=3.0"]
aws = ["boto3>=1.34"]
gcs = ["google-cloud-storage>=2.10"]
docs = ["playwright>=1.59"]
oauth = ["authlib>=1.7,<2", "joserfc>=0.12", "requests>=2.31"]

[tool.maturin]
manifest-path = "../../crates/flexiq-python/Cargo.toml"
python-source = "."
module-name = "flexiq._flexiq"
features = ["extension-module", "postgres", "redis", "workflows"]
include = [
    { path = "flexiq/static/dashboard/**/*", format = ["wheel", "sdist"] },
    { path = "flexiq/contrib/django/templates/**/*", format = ["wheel", "sdist"] },
]

[project.scripts]
flexiq = "flexiq.cli:main"    

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# -- Ruff --

[tool.ruff]
target-version = "py310"
line-length = 99
exclude = [".venv", "target", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"flexiq/dashboard.py" = ["E501"]  # embedded HTML/JS strings

[tool.ruff.lint.isort]
known-first-party = ["flexiq"]

# -- Mypy --

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "flexiq._flexiq"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cloudpickle"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "pydantic"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentry_sdk"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "flask"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "click"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joserfc", "joserfc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true

