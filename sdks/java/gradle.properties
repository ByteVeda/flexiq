# Coordinates for every project in the build — Gradle applies these to the root
# project and each subproject. `version` mirrors the root Cargo.toml and is
# rewritten by scripts/version.mjs; do not hand-edit it.
group=org.byteveda
version=0.21.0

# Null-safety toolchain, shared by every published Java module so the three
# build scripts can't drift apart on versions.
jspecifyVersion=1.0.0
errorProneVersion=2.50.0
nullAwayVersion=0.13.8
