plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Wire field names are long and descriptive; the default 120 still binds.
Layout/LineLength:
  Max: 120

# Codec and mapping methods are a flat table of cases; splitting them hides the table.
Metrics/MethodLength:
  Max: 30
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Metrics/AbcSize:
  Max: 40

# Constructors take keyword options mirroring the wire messages; keywords cannot be mis-ordered.
Metrics/ParameterLists:
  CountKeywordArgs: false
Metrics/ClassLength:
  Max: 200

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"

Minitest/MultipleAssertions:
  Max: 8
