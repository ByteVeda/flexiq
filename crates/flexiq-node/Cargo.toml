[package]
name = "flexiq-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Node.js (napi-rs) bindings for the FlexiQ task-queue core"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
postgres = ["flexiq-core/postgres", "flexiq-workflows?/postgres"]
redis = ["flexiq-core/redis", "flexiq-workflows?/redis"]
mesh = ["dep:flexiq-mesh"]
workflows = ["dep:flexiq-workflows"]
# Event-driven scheduler wakeups. OFF by default (not in the shipped addon's
# feature list); `pushDispatch` is accepted and ignored without it.
push-dispatch = ["flexiq-core/push-dispatch"]

[dependencies]
flexiq-core = { workspace = true }
# `dyn-symbols` is a napi 3 default that `default-features = false` drops; it
# resolves the Node symbols at load time rather than linking against them.
# The floor tracks what `napi-derive` expands to — cargo can't see that
# dependency, so a lone derive bump otherwise resolves against a runtime
# missing the prelude items it emits (3.12: `NativeBorrow{Scope,Barrier}`).
napi = { version = "3.12", default-features = false, features = [
    "napi8",
    "tokio_rt",
    "dyn-symbols",
] }
napi-derive = "3.6.2"
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
gethostname = "1"
flexiq-mesh = { workspace = true, optional = true }
flexiq-workflows = { workspace = true, optional = true }

[build-dependencies]
napi-build = "2"
