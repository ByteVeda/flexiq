[package]
name = "flexiq-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embeddable task queue: SQLite/Postgres/Redis storage, scheduler with retries, rate limits, and workers"
keywords = ["task-queue", "jobs", "scheduler", "background", "worker"]
categories = ["asynchronous", "database"]
readme = "README.md"
# `tests/wire_vectors.rs` asserts `contracts/wire-vectors.json`, which lives at
# the repository root because four runtimes assert the same file. `cargo package`
# carries nothing above the package root, so this one target cannot compile from
# a published tarball — it is a repository test hosted in a crate, not a crate
# test. Excluded rather than fixed in place: moving the vectors in here would
# give one fact two homes, and letting the test pass when it cannot find them
# would be a conformance gate that fails open.
exclude = ["tests/wire_vectors.rs"]

[features]
default = []
postgres = ["diesel/postgres", "pq-sys", "openssl-sys", "sea-query/backend-postgres"]
redis = ["dep:redis"]
# Event-driven scheduler wakeups. Off in this crate's defaults, but every
# shipped artifact enables it: push is then on by default for Redis, opt-in on
# SQLite/Postgres, and `push_dispatch = false` opts a scheduler out.
push-dispatch = []
# HTTP push dispatch (#843): the scheduler dials an operator-configured target
# per job, for platforms that start a process from an inbound request. OFF by
# default and absent from every shipped wheel — a queue that never dials out
# should not compile an HTTP client or a TLS stack.
#
# Unrelated to `push-dispatch` above, which is event-driven scheduler wakeups.
# The two names are close; the features share nothing.
http-target = ["dep:url", "dep:reqwest", "dep:hmac", "dep:sha2", "dep:percent-encoding"]

[dependencies]
diesel = { workspace = true }
libsqlite3-sys = { workspace = true }
pq-sys = { workspace = true, optional = true }
openssl-sys = { workspace = true, optional = true }
uuid = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
rand = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
chrono-tz = { workspace = true }
log = { workspace = true }
async-trait = { workspace = true }
sea-query = { workspace = true }
redis = { workspace = true, optional = true }
# The same parser the HTTP client resolves the request with, so the egress
# guard and the connect cannot disagree about where the host ends.
url = { version = "2", optional = true }
# The outbound HTTP client for push dispatch. `default-features = false` drops
# charset, http2 and the system-proxy probe; `rustls-tls` because the server
# image carries no system OpenSSL. `json` because the credential endpoints in
# `http::auth::metadata` answer JSON — added in this commit, which only reads
# the raw body, so the OIDC and SigV4 commits that actually parse it don't
# each need their own `reqwest` feature edit. Same feature set flexiq-server
# already resolves, so a workspace build gains an edge and not a node.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# HMAC-SHA256 for the outbound dispatch signature. Same versions
# flexiq-server already resolves for its webhook signing, so the workspace
# keeps one copy of each.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
# RFC 3986 percent-encoding against an explicit `AsciiSet`. SigV4's canonical
# URI and query encode against the unreserved set and nothing else, which
# `url`'s own encoder does not expose. Already compiled — `url` depends on it.
percent-encoding = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
# Hand-rolled wire frames in the executor-attach tests: a frame type this build
# has no variant for is exactly what the forward-compatibility path is about, so
# the test has to be able to serialize one.
serde = { workspace = true }
# Raw connection access in the Redis contract tests, to set up race-window
# state and assert on internal index keys. Only used by `#[cfg(feature = "redis")]`
# tests; harmless when the feature is off.
redis = { workspace = true }
# Raw connection access in the Postgres contract test to reset the `flexiq`
# schema up front, so the count-exact assertions are deterministic on a
# persistent test DB (the Postgres analogue of the Redis suite's FLUSHDB). Only
# used by `#[cfg(feature = "postgres")]` tests.
diesel = { workspace = true }
