[package]
name = "taskito-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Node.js (napi-rs) bindings for the Taskito task-queue core"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
postgres = ["taskito-core/postgres", "taskito-workflows?/postgres"]
redis = ["taskito-core/redis", "taskito-workflows?/redis"]
mesh = ["dep:taskito-mesh"]
workflows = ["dep:taskito-workflows"]
# Event-driven scheduler wakeups. OFF by default (not in the shipped addon's
# feature list); `pushDispatch` is accepted and ignored without it.
push-dispatch = ["taskito-core/push-dispatch"]

[dependencies]
taskito-core = { workspace = true }
# `dyn-symbols` is a napi 3 default that `default-features = false` drops; it
# resolves the Node symbols at load time rather than linking against them.
napi = { version = "3", default-features = false, features = [
    "napi8",
    "tokio_rt",
    "dyn-symbols",
] }
napi-derive = "3"
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
gethostname = "1"
taskito-mesh = { workspace = true, optional = true }
taskito-workflows = { workspace = true, optional = true }

[build-dependencies]
napi-build = "2"
