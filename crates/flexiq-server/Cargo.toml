[package]
name = "flexiq-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standalone FlexiQ scheduler, executor attach listener, dashboard, and gRPC server"
publish = false

[lib]
name = "flexiq_server"
path = "src/lib.rs"

[[bin]]
name = "flexiq-server"
path = "src/main.rs"

[features]
default = []
# Forward backend selection down to core + workflow storage so one DSN sniff
# in config/backend.rs can open Postgres / Redis when compiled in.
postgres = ["flexiq-core/postgres", "flexiq-workflows/postgres"]
redis = ["flexiq-core/redis", "flexiq-workflows/redis"]
# The gRPC role. Off by default so a build that wants the three HTTP-shaped
# roles does not compile tonic; FLEXIQ_GRPC_LISTEN is refused outright by a
# binary built without it, rather than silently ignored.
grpc = [
  "dep:tonic",
  "dep:tonic-health",
  "dep:tonic-reflection",
  "dep:tokio-stream",
  "dep:prost",
  "dep:prost-types",
  "dep:tonic-prost",
  "dep:tonic-types",
  "dep:http",
  "dep:tower-layer",
  "dep:tower-service",
  "dep:tonic-prost-build",
  "dep:async-trait",
]

[dependencies]
flexiq-core = { workspace = true }
flexiq-workflows = { workspace = true }
axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
anyhow = "1"
log = { workspace = true }
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
rand = { workspace = true }
base64 = "0.23"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
thiserror = { workspace = true }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Same parser reqwest uses, so the SSRF guard and the request agree on the host.
url = "2"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
# The gRPC role, all optional behind `grpc`. Default features carry the router
# and server; they also carry the channel client, which is what the role's
# integration test dials its own listener with.
# The `Authenticator` seam answers from storage, which is blocking, so the
# trait returns a boxed future — `dyn Authenticator` rules out a plain async fn.
async-trait = { workspace = true, optional = true }
tonic = { version = "0.14", optional = true }
tonic-health = { version = "0.14", optional = true }
tonic-reflection = { version = "0.14", optional = true }
# Wraps a bound UnixListener as the incoming stream tonic serves over.
tokio-stream = { version = "0.1", features = ["net"], optional = true }
# What build.rs generates against: prost for the messages, tonic-prost for the
# codec the generated services name, prost-types for the well-known types.
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
# google.rpc: the Status carried by a batch item's error arm, and the
# ErrorInfo / RetryInfo details every non-OK response attaches.
tonic-types = { version = "0.14", optional = true }
# The request and response types the auth layer sits between. tonic, axum and
# hyper all speak this one `http`; naming it keeps the layer from reaching
# through `tonic::codegen`, which is codegen's namespace and not an API.
http = { version = "1", optional = true }
# The two trait crates the auth layer implements. tonic already pulls both in;
# depending on them by name is what lets `grpc/auth/layer.rs` name the traits
# rather than reaching through `tonic::codegen`.
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }

[build-dependencies]
# Codegen reads contracts/descriptor.binpb — the FileDescriptorSet buf already
# builds, lints and gates — instead of running protoc over the .proto files.
# One artifact, so the Rust types cannot describe a different contract from the
# one CI checks and the binary serves over reflection, and no protoc on any
# developer's PATH. Optional for the same reason the runtime half is: a build
# without the role should not compile a code generator.
tonic-prost-build = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
