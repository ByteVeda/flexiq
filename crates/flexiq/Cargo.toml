[package]
name = "flexiq"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embeddable task queue for Rust — the `flexiq` entry point, re-exporting flexiq-core"
keywords = ["task-queue", "jobs", "scheduler", "background", "worker"]
categories = ["asynchronous", "database"]
readme = "README.md"
# `tests/wire_vectors.rs` reads `contracts/wire-vectors.json`, which lives above
# this crate's root and therefore cannot travel in the package. Excluding the
# file keeps `cargo build --tests` working from the tarball — `cargo package`'s
# own verify pass builds lib and bin targets only and would not catch it. #900.
exclude = ["tests/wire_vectors.rs"]

[features]
default = []
# Forwarded verbatim so `cargo add flexiq --features postgres` behaves exactly
# as the same flag on flexiq-core does.
postgres = ["flexiq-core/postgres", "flexiq-workflows?/postgres"]
redis = ["flexiq-core/redis", "flexiq-workflows?/redis"]
push-dispatch = ["flexiq-core/push-dispatch"]
# The companion engines, off by default. The other SDKs ship them inside a single
# compiled artifact; Rust resolves source crates, so the equivalent is an opt-in
# dependency — no consumer pays for a DAG engine or a gossip mesh unasked.
workflows = ["dep:flexiq-workflows"]
mesh = ["dep:flexiq-mesh"]

[dependencies]
flexiq-core = { workspace = true }
flexiq-workflows = { workspace = true, optional = true }
flexiq-mesh = { workspace = true, optional = true }
# A failed job records canonical JSON, not a bare message — the shape every
# other shell reads. See `outcome::task_error_json`.
serde_json = { workspace = true }
# Task arguments are `Serialize`; `encode` turns them into core's WireValue.
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = "0.4"
