[package]
name = "taskito-java"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Java (JNI) bindings for the Taskito task-queue core"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
postgres = ["taskito-core/postgres", "taskito-workflows?/postgres"]
redis = ["taskito-core/redis", "taskito-workflows?/redis"]
workflows = ["dep:taskito-workflows"]
mesh = ["dep:taskito-mesh"]
# Event-driven scheduler wakeups. OFF by default (not in the shipped library's
# feature list); `pushDispatch` is accepted and ignored without it.
push-dispatch = ["taskito-core/push-dispatch"]

[dependencies]
taskito-core = { path = "../taskito-core" }
taskito-workflows = { path = "../taskito-workflows", optional = true }
taskito-mesh = { path = "../taskito-mesh", optional = true }
base64 = "0.23"
jni = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = "1"
tokio = { workspace = true }
async-trait = { workspace = true }
crossbeam-channel = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
gethostname = "1"
